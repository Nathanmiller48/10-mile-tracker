<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0d0f">
  <title>10 Miles</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="eyebrow">Nov 12 – Dec 31, 2026</p>
      <h1>10 miles nonstop</h1>
    </header>

    <section class="route" aria-label="The route: ten miles">
      <svg viewBox="0 0 340 56" role="img" aria-label="A ten-mile line with a marker at each mile, not yet started">
        <line class="route-line" x1="10" y1="22" x2="330" y2="22"/>
        <g id="route-markers"></g>
      </svg>
    </section>

    <p class="status" id="status">Coming soon.</p>
    <noscript><p class="status">This site needs JavaScript.</p></noscript>
  </main>
</body>
</html>
